# Day 11 shared "test" profile — activated by every full-context test: AuraApplicationTests, EvalRunner,
# and (together with `it`) the *IT classes. Its job here is narrow and prod-like: exclude
# ConversationRunner (@Profile("!test"), a dev-time live Claude call) and guarantee a non-blank API key.
#
# It deliberately does NOT shorten timeouts or retry waits — those aggressive, MockWebServer-only values
# live in application-it.yml. EvalRunner shares `test` but NOT `it`, so its -Pevals live calls keep the
# prod-like timeout from application.yml (30s). One profile, one job; the fast values are opt-in via `it`.
# Day 13 — the DATABASE IS OPT-IN under test, and this single line is what makes that true.
#
# Adding spring-boot-starter-data-jpa put DataSourceAutoConfiguration on the classpath for EVERY
# context, including the ones that have never touched a database: AuraApplicationTests, EvalRunner,
# AnthropicTransportIT, RedisDegradationIT, lab/CrossModelDemoIT. Without this exclusion each of them
# would fail at startup demanding a JDBC url, and the fix would be to hand them all a Postgres
# container — which would put a hard Docker prerequisite on the fast, free, offline `mvn test` suite.
# That trade is the wrong way round: the DB-less tests outnumber the DB tests, so absence is the
# default and presence is declared.
#
# The two classes that DO need Postgres opt back in with @SpringBootTest(properties =
# "spring.autoconfigure.exclude=") — an explicit empty value at the highest-precedence property
# source, which replaces this list rather than merging with it. Written as ONE comma-separated string
# rather than a YAML sequence so that override is a like-for-like replacement of a single property.
#
# Excluding DataSourceAutoConfiguration alone is sufficient and deliberate: Hibernate JPA, Flyway,
# Spring Data JPA repositories and the transaction manager are all conditional on a DataSource bean,
# so they all back off behind it. One exclusion, one reason, no list to keep in sync.
#
# MIND THE PACKAGE. Boot 4 split the monolithic spring-boot-autoconfigure jar into per-technology
# modules and moved this class from org.springframework.boot.autoconfigure.jdbc to
# org.springframework.boot.jdbc.autoconfigure. A stale name here does NOT fail — Boot only rejects an
# exclusion whose class is on the classpath but is not an auto-configuration; a name that resolves to
# nothing is skipped in silence. So the wrong package reads exactly like the right one until a test
# tries to reach localhost:5432. (Observed, then fixed.)
spring:
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

aura:
  anthropic:
    # MockWebServer never checks auth; the dummy keeps the presence law universal — one rule, no profile
    # branches to drift. ${ANTHROPIC_API_KEY:test-key}: the real key when present (EvalRunner -Pevals
    # live calls), a dummy otherwise (MockWebServer ITs). Either way non-blank, so @NotBlank is satisfied.
    api-key: ${ANTHROPIC_API_KEY:test-key}
    # base-url is injected per-class by the ITs via @DynamicPropertySource (the MockWebServer port);
    # under plain `test` it stays the application.yml default (the SDK endpoint), which is what evals need.

  # Day 14 — the boot canary is OFF under test, and this is a tradeoff being accepted out loud rather
  # than a convenience.
  #
  # The canary's whole job is to make a live Voyage call at startup and refuse to boot when the result
  # is outside a measured band. Leaving it on here would put that live, billable, network-dependent
  # call in the boot path of every full-context test — which would make `mvn test` need a real API key
  # and an internet connection to start a Spring context, and would make the suite fail whenever
  # Voyage has a bad minute. That is a worse property than the one it would buy.
  #
  # What it costs: the canary is never exercised against live Voyage in CI. Its LOGIC — band
  # comparison, the refuse-to-boot path, the store probe's on/off behaviour — is unit-tested with
  # fixed vectors and stubbed distances (RetrievalCanaryCheckTest), and the band itself is a measured
  # artefact produced by CanaryBandHarnessIT, which is manual for the same reasons. So what is
  # untested in CI is exactly the seam between those two: that a real Voyage call lands inside the
  # real band. That seam is tested by booting the application, which is the DoD check for the day.
  canary:
    enabled: false

# Day 12 — same presence law, second dependency. The @NotBlank on VoyageProperties applies to every
# context, so a full-context test that never embeds anything still needs a non-blank key.
# ${VOYAGE_API_KEY:test-key}: the real key when present (SemanticSearchDemoIT under -Pdemo makes live
# calls), a dummy otherwise. SemanticSearchDemoIT asserts the key is NOT the dummy before it starts,
# so the fallback can never quietly turn a live demo into a 401.
voyage:
  api-key: ${VOYAGE_API_KEY:test-key}
