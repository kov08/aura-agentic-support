spring:
  application:
    name: aura
  # Day 9 (ADR-018): the spring-boot-starter-data-redis starter auto-configures a
  # StringRedisTemplate against these two properties alone — no @Configuration class. That
  # template is injected in ResolutionCache. Redis is a fail-open cost layer, so a wrong/unreachable
  # host degrades every lookup to a MISS rather than erroring (see ResolutionCache.get).
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 250ms   # bounds TCP establishment (covers silent SYN drops)
      timeout: 250ms           # bounds each command's wait for a reply — THIS was the 60s default

  # --- Day 13: the vector store ---------------------------------------------------------------
  # Unlike Redis above, this is a SOURCE OF TRUTH. Redis failing degrades cost; Postgres failing
  # stops the boot, because Flyway and Hibernate's schema validation both run at startup. Env-driven
  # with local-dev defaults that match docker-compose.yml, so a fresh clone runs with no .env at all.
  #
  # --- Day 14 (TASK 6) — HOT-PATH REVIEW OF THESE TIMEOUTS. Findings only; nothing changed. ------
  #
  # Yesterday this datasource served an offline batch ingestion. As of today it serves
  # RetrievalService on every customer ticket, so the values below sit on a customer-facing read for
  # the first time and deserve to be looked at rather than inherited.
  #
  # FINDING 1 — the values below are ALL DEFAULTS. There is no spring.datasource.hikari.* block and
  # no JDBC connection property anywhere in this file, so what is actually in force is:
  #     hikari.connection-timeout   30s     (wait for a pooled connection)
  #     hikari.maximum-pool-size    10
  #     hikari.validation-timeout   5s
  #     pgjdbc socketTimeout        UNSET  -> no bound at all on a query's wait for a reply
  #     pgjdbc connectTimeout       10s
  #   The unset socketTimeout is the one that matters, and it is the Day 9 Redis lesson repeating
  #   verbatim on a different driver: an un-set timeout is not "fast by default", it is "unbounded by
  #   default", and it only shows up when the dependency is already having a bad day. A Postgres that
  #   accepts the connection and then stalls hangs the retrieval query — and therefore the ticket —
  #   forever, or until the servlet container gives up on it, which is a different component's
  #   opinion about our latency budget.
  #
  # FINDING 2 — 30s to WAIT FOR A CONNECTION is a batch-shaped number on a customer-facing read.
  #   It is a reasonable value for a batch ingestion pass, which would rather queue than fail halfway
  #   through a billable embedding run. It is a poor one for a ticket: nobody is helped by a resolution that
  #   arrives after half a minute of pool starvation, and a request that fails fast can degrade,
  #   while one that blocks holds a servlet thread the whole time.
  #
  # FINDING 3 — pool size 10 alongside a batch loader that runs in the SAME application. The loader
  #   is flag-gated and one-shot, so today the two workloads never overlap in practice. Worth naming
  #   anyway: the moment ingestion becomes a background job (Day 15), one pool serves both a batch
  #   writer and a latency-sensitive reader, and 10 connections shared between them is where FINDING 2
  #   stops being theoretical.
  #
  # ADJACENT, and outside this block: voyage.read-timeout is 5s for BOTH lanes. That budget was sized
  #   for a 64-chunk ingestion batch and is now also the bound on the single per-ticket query
  #   embedding — a call that should complete in well under a second. The comment on that property
  #   already flags the per-lane split as Day 14 work; it remains open, and it is the same shape of
  #   defect as FINDING 2: one number sized for the batch case, silently reused on the hot path.
  #
  # FINDINGS 1 AND 2 ARE NOW FIXED, below. Finding 3 (pool size vs a future background ingester) is
  # left as a runbook item, because it is not a problem until ingestion stops being a one-shot flag.
  #
  # WHY THE VALUES COULD BE CHOSEN AT ALL — "fallback-aware sizing". A timeout is only as good as what
  # happens when it fires, and until Decision 5 landed the answer here was "an HTTP 500". Under that
  # regime a tight bound is a bad trade: it converts a slow query into an error page, so the safe
  # setting is a generous one, which is how unbounded defaults survive review.
  #
  # Decision 5 changed the consequence, and that is what makes these numbers affordable. Retrieval
  # failure now degrades to ESCALATED_TO_HUMAN at HTTP 200 — and NOT by coincidence: both timeouts
  # below surface as exceptions already on that allowlist. Hikari's pool timeout throws
  # SQLTransientConnectionException, which Spring translates to CannotGetJdbcConnectionException (a
  # DataAccessResourceFailureException); pgjdbc's socketTimeout raises SQLState 08006, which Spring
  # maps to DataAccessResourceFailureException too. So firing either one hands the customer a human
  # agent, not an error page. Sized for the customer's patience rather than the query's worst case.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aura}
    username: ${POSTGRES_USER:aura}
    password: ${POSTGRES_PASSWORD:aura}
    hikari:
      # 2000 MILLISECONDS — and the bare number is not sloppiness, it is required. HikariConfig
      # declares this as a `long` of milliseconds, so Boot's Duration parsing does not apply and
      # "2000ms" fails to bind. Compare spring.data.redis.timeout above, which IS a Duration and must
      # be written "250ms". Two timeouts, two units, one file: read the target type, not the
      # neighbour.
      #
      # Replaces a 30s default that was sized for a batch loader that would rather queue than fail.
      # A ticket has the opposite preference: nobody is helped by a resolution that arrives after
      # half a minute of pool starvation, and a request that fails fast can degrade while one that
      # blocks holds a servlet thread for the whole wait.
      connection-timeout: 2000
      data-source-properties:
        # pgjdbc's socketTimeout, and its unit is SECONDS — not milliseconds, and not a Duration.
        # This is the finding that mattered most in the Day 14 review: unset, there is NO bound at
        # all on a query's wait for a reply, so a Postgres that accepts the connection and then
        # stalls hangs the ticket until some other component's patience runs out. That is the Day 9
        # Redis lesson (an un-set timeout is not "fast by default", it is "unbounded by default")
        # repeating verbatim on a different driver.
        #
        # 2s against a retrieval query whose measured p50 is single-digit milliseconds on a
        # 34-chunk corpus — roughly two orders of magnitude of headroom, so this fires on a stall,
        # never on a slow-but-working query.
        #
        # SCOPE WORTH NAMING: this applies to EVERY statement on this DataSource, including the
        # ingestion path. Day 15 has now landed and the bound still holds, for a reason worth
        # recording rather than re-deriving: IngestionPipeline's unit of work is ONE DOCUMENT — a
        # bulk delete of a handful of chunk rows, then an insert of a handful more — and the long
        # part of ingestion is the Voyage call, which is deliberately made OUTSIDE the transaction.
        # No single statement it issues comes close to 2s.
        #
        # The warning it replaces still stands for whatever comes next: an ingester with a genuinely
        # long-running statement needs its own DataSource or its own bound, not a relaxed value here,
        # because relaxing it here silently un-bounds the customer path again.
        socketTimeout: 2

  jpa:
    hibernate:
      # Flyway WRITES the schema; Hibernate only VERIFIES it. `validate` compares the entity mappings
      # against the live tables at boot and refuses to start on a mismatch, so schema drift — an entity
      # field added without a migration, a migration applied without the entity — dies at startup
      # instead of at the first query that touches the missing column. The alternative defaults are
      # both worse in the same direction: `update` silently mutates the schema behind Flyway's back
      # (two writers, one schema, no history), and `none` makes drift undetectable until runtime.
      ddl-auto: validate
    # OSIV holds a Hibernate session open for the ENTIRE web request, so a lazy association can be
    # dereferenced from a controller or a serializer and quietly issue a query — the N+1 that never
    # appears in the service code. It also keeps a connection checked out of the pool for the whole
    # request rather than for the duration of the work, so pool exhaustion arrives under load rather
    # than under query volume. Spring Boot defaults it ON and warns about it; off is the hygienic
    # setting and it is set explicitly so nobody has to wonder which default is in effect.
    open-in-view: false

# Response-cache tuning. Kept OUT of spring.* on purpose: this is AURA's own policy, not a
# framework setting.
aura:
  # Day 11 (TASK 3) — the Anthropic transport seam. These keys exist with the SAME NAMES in every
  # profile; the identical name IS the drift guard — the integration tests drive the exact properties
  # production reads, so the seam is configuration, not a code branch.
  anthropic:
    # Binds from the ANTHROPIC_API_KEY env var (name unchanged). @NotBlank on AnthropicProperties makes
    # a missing/blank key fail the context at startup with a clear message, instead of a late 401 on the
    # first Claude call. The empty default means "absent" -> blank -> fail fast (not a silent empty key).
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ""     # empty in prod → the SDK's default endpoint (api.anthropic.com). Integration
                     # tests set this to a local MockWebServer via @DynamicPropertySource.
    timeout: 30s     # per-request time bound; the test profile overrides this to 500ms
  cache:
    ttl: 24h   # Spring binds "24h" to java.time.Duration — TTL is config, not a magic number

  # Day 13 — the embedding SPACE, as opposed to the embedding TRANSPORT under voyage.* below. It lives
  # here and not there because the dimension is not a property of the Voyage API, it is a property of
  # AURA's schema: the same number is baked into `vector(1024)` in V2__create_kb_chunks.sql and into
  # @Array(length = 1024) on KbChunk. Three copies of one fact is two too many, and the honest
  # response to that is not to delete two of them — a migration cannot read a Java constant and
  # Hibernate cannot read SQL — but to CHECK them against each other at every boot. That is
  # EmbeddingDimensionCheck's whole job.
  #
  # 1024 is what voyage-4-large and voyage-4-lite both return. Changing it is not a config tweak: it
  # obsoletes every stored vector, needs a new migration, and forces a full re-embed of the corpus —
  # the same consequence the voyage.*-model family check exists to make visible.
  embedding:
    dimension: 1024

  # --- Day 15: the incremental ingestion pipeline ------------------------------------------------
  # Replaces Day 13's KbCorpusLoader, which had exactly two behaviours — skip everything, or wipe the
  # table and re-embed everything — because the only question it could ask the database was "are
  # there any rows?". kb_documents now records a fingerprint per document, so the question becomes
  # per-document and the answer becomes a plan.
  #
  #   ./mvnw spring-boot:run -Daura.ingest.enabled=true
  #
  # STILL OFF BY DEFAULT, and for a weaker reason than before. The first run is billable and
  # minutes-long; every run after it over an unchanged corpus costs zero embedding calls and a
  # handful of SELECTs, so leaving it on would be nearly free. It stays off because "nearly free" is
  # a property of the steady state, and the run that is NOT in the steady state — the one after a
  # model change, which re-embeds the whole corpus — is the one that would fire unattended.
  #
  # The trigger is an ApplicationRunner, not an admin REST endpoint. An endpoint would be more
  # convenient and it is deliberately parked: an unauthenticated endpoint that can rewrite the
  # knowledge base is a guardrails problem, and this application has no authentication until Day 18.
  ingest:
    enabled: false
    dir: kb        # the corpus directory, resolved relative to the working directory
    # The override for the destructive-plan guards (delete >50% of the ledger; find zero markdown
    # files while the ledger is populated). It belongs on a command line, never in a committed file:
    # the guards exist to catch a wrong working directory, and a config that permanently disables
    # them is a config that catches nothing. The pipeline logs at WARN every time this is honoured.
    force: false

  # --- Day 14 (Decisions 2 + 3): retrieval policy ------------------------------------------------
  retrieval:
    # CORPUS-RELATIVE, and that is a property of this number, not a caveat about it. 8 ≈ a quarter of
    # today's 34-chunk corpus — asking for a quarter of everything is a reasonable candidate pool at
    # this size and would be an absurd one at 10,000 chunks. Revisit at Day 15 ingestion, when the
    # corpus stops being three policy documents.
    #
    # k is the WIDTH OF THE POOL, not the number of chunks the model sees: the token budget and the
    # adjacency dedup both cut into it, and typically 3-5 of these 8 survive. Widening k costs one
    # LIMIT clause and buys the packer more distinct material to choose from after dedup; it does not
    # directly cost prompt tokens. That asymmetry is why k can be generous while the budget is not.
    k: 8
    # Measured, 2026-08-04, against the real corpus:
    #   SELECT count(*), sum, min, avg, median, p90, max OF token_count FROM kb_chunks;
    #   -> n=33  total=4860  min=67  median=133  avg=147.27  p90=189  max=499
    #
    # RE-MEASURED 2026-08-08, after Day 16 added the gift-card section to refund-policy.md:
    #   -> n=34  total=5122  min=67  median=134  avg=150.65  p90=194  max=499
    # Recorded rather than quietly overwritten, because the point of the derivation below is that the
    # number came from a corpus shape — so when the corpus changes, the honest thing is to show that
    # the shape did NOT move enough to matter. avg 147.27 -> 150.65 shifts the admissible window from
    # [589, 736] to [603, 753]; 700 is comfortably inside both. max is unchanged at 499, which is the
    # constraint that actually pinned the value. No change is warranted and none is made.
    #
    # DERIVATION. The sizing rule was "admit ~4-5 average chunks", which fixes a window:
    #   4 x 147.27 = 589   (floor)      5 x 147.27 = 736   (ceiling)      700 = 4.75 x avg
    #
    # Read that 4.75 as the budget's SIZE in average-chunk units, NOT as an admit count. Packing
    # STOPS at the budget rather than skipping ahead to something smaller, so a run of exactly-average
    # chunks admits FOUR (589 spent, 111 left — short of a fifth at 147). The "four to five" behaviour
    # is real but comes from the median: 700 / 133 = 5.26. The first live ticket landed at 4 chunks /
    # 599 tokens, which is what both numbers predict.
    #
    # WHAT PINNED IT INSIDE THE WINDOW — max=499, and it rules out the bottom half. The budget must
    # clear the largest chunk or RetrievalService's "packed NOTHING" path becomes reachable and the
    # ticket is answered ungrounded. Barely clearing it is not enough either:
    #   at 589 (the window floor):  499 + 133 = 632 > 589  -> a max-size top hit admits ONE chunk
    #   at 700:                     499 + 133 = 632 < 700  -> it still admits a second
    # That is the strongest single argument in this decision, and it points upward.
    #
    # SHAPE. 31 of the 34 chunks sit between 67 and 194; the only outliers are one 242, one 323 and
    # one 499. So the mean is dragged up by a short tail and the median is the better description of a
    # typical chunk — sizing on the mean is conservative in the right direction here. That spread is
    # also why the budget is expressed in TOKENS rather than as "top 4": how many chunks survive
    # genuinely varies per ticket, and it should.
    #
    # NOT MEASURED, and worth saying so. Between 589 and 736 nothing distinguishes 700 from 690 or
    # 720 — it is a round number inside an admissible window. More to the point, answer QUALITY has
    # never been measured against this budget: there is no recall@k sweep and no eval run at 500 vs
    # 700 vs 900. This number is derived from the corpus's shape and a rule of thumb, not from an
    # outcome. Day 16's grounding evals are the first measurement that touches it — they score whether
    # the answer was grounded and cited, which is downstream of whether the right chunk fitted.
    #
    # The unit is the stored token_count: the same ~4-chars-per-token English APPROXIMATION the
    # chunker uses, because there is no clean JVM build of Voyage's tokenizer. Packing is integer
    # arithmetic on numbers the database already holds — nothing tokenizes at request time.
    context-token-budget: 700

  # --- Day 14 (Decision 1): the retrieval canary -------------------------------------------------
  # Boot-time proof that the query lane and the stored corpus are still in the same embedding space.
  # Full rationale on CanaryProperties; the operational consequence is stated plainly here:
  #
  #   WITH THIS ON, BOOTING REQUIRES VOYAGE TO BE REACHABLE. That is not a bug to be fixed later, it
  #   is the cost of fail-fast, accepted deliberately. The alternative is an application that starts
  #   happily while retrieving from a space its queries no longer live in — which returns confident,
  #   ranked, meaningless results and raises no error anywhere. A refused boot is loud; that failure
  #   is silent, and silent is the one AURA has already been bitten by (the Day 12 cross-model lab).
  canary:
    enabled: true
    # THERE IS NO source-doc / chunk-index HERE ANY MORE, and the absence is the decision.
    #
    # Day 15 moved the canary off refund-policy.md#0 onto a synthetic document, because ingestion had
    # become automatic: the pipeline rebuilds a document's chunks the moment its fingerprint moves, so
    # an editor adding one sentence to the top of refund-policy.md would silently change what chunk 0
    # SAYS and this guard would refuse the next boot for a reason unrelated to the embedding space it
    # watches. A tripwire that fires on ordinary policy edits is a tripwire that gets switched off.
    # The text is now a code constant (org.aura.aura.canary.CanaryDocument) — byte-for-byte what
    # refund-policy.md chunk 0 held when the band below was measured, which is why that measurement
    # carried over instead of needing a re-run. Verified on the first Day 15 boot: 0.24347983, in band.
    #
    # V4 then moved the VECTOR out of kb_chunks into canary_probe, a one-row table whose
    # CHECK (id = 1) makes the singleton a schema fact. Two things fell out of that:
    #
    #   - The retrieval corpus stopped containing a duplicate of refund-policy.md chunk 0. That
    #     duplicate was a real cost — a refund query could match both and spend part of a 700-token
    #     context budget twice on one passage — and the fix is separation by TABLE rather than a
    #     WHERE clause, so no future query has to remember to exclude it.
    #   - The addressing properties became meaningless, so they are deleted rather than left pointing
    #     at nothing. That matters more than tidiness: a guard that reads its own target out of
    #     configuration can be aimed at the wrong thing by a config edit, which is exactly the class
    #     of silent misconfiguration this guard exists to catch, reintroduced inside the guard.
    # MEASURED 2026-08-04 by CanaryBandHarnessIT. n=20 fresh voyage-4-lite/query embeddings of the
    # canary chunk's exact embedding input, each compared by Postgres against the stored
    # voyage-4-large/document vector:
    #
    #   min=0.24288794  max=0.24363139  mean=0.24342135  spread=0.00074345
    #
    # Rule, PRE-REGISTERED before any of those numbers existed and not adjusted afterwards:
    #   band = [ min - 0.5*(max-min),  max + 0.5*(max-min) ]
    #
    # An observation, recorded rather than acted on: the spread is ~0.0007, so this band is extremely
    # tight — Voyage is very nearly deterministic for a fixed input. That makes the guard a precise
    # detector of the thing it is for (a model swap, a lane flip, a corpus re-embedded under a
    # different model) and also means it WILL trip if Voyage silently updates either model behind a
    # stable name. That is the correct outcome, not a false positive: a provider-side model change is
    # exactly the event that invalidates a stored corpus, and it is precisely the change that
    # otherwise arrives with no signal at all.
    #
    # If this band ever needs to change, the way to change it is to re-run the harness and paste the
    # new numbers — never to widen these by hand. A hand-widened band is a band with no rule behind
    # it, and its width then encodes nothing except how annoyed someone was that morning.
    band:
      min-distance: 0.242516
      max-distance: 0.244003
    store-probe:
      # OFF. Enable when a canary trip needs self-diagnosis: this probe re-embeds the canary on the
      # DOCUMENT lane and measures fresh-vs-stored within one model, which isolates the store's side
      # of the pairing. Near zero => the corpus and the document model are intact, so the trip came
      # from the query lane. Clearly non-zero => the stored vectors themselves have gone stale.
      # It costs a premium-model embedding on every boot, which is why it is not left on.
      enabled: false

# --- Day 12: Voyage embeddings + chunking ------------------------------------------------------
# Top-level (not under aura.*) because this is a second EXTERNAL dependency's transport config, the
# sibling of aura.anthropic.* — the two blocks are deliberately shaped alike.
voyage:
  # Binds from the VOYAGE_API_KEY env var. @NotBlank on VoyageProperties makes a missing/blank key
  # fail the context at startup, same law as ANTHROPIC_API_KEY. The empty default means "absent" ->
  # blank -> fail fast, never a silent empty key.
  api-key: ${VOYAGE_API_KEY:}
  base-url: https://api.voyageai.com   # tests point this at a local MockWebServer; the seam is config

  # THE asymmetric pair. Model names live here, not as literals in the client: changing the family is
  # not a config tweak, it obsoletes every stored vector and forces a full corpus re-embed, and that
  # consequence should be visible in a config diff. VoyageProperties enforces at startup that both
  # names share the voyage-4 family — asymmetric models are only comparable inside one shared space.
  document-model: voyage-4-large   # premium, ONE-TIME offline ingestion lane
  query-model: voyage-4-lite       # economy, PER-TICKET online lane
  # The vector WIDTH these two produce is aura.embedding.dimension (1024), above. It is deliberately
  # not repeated here: this block owns which model is called, the schema owns how wide its output is,
  # and EmbeddingDimensionCheck is what keeps that second fact honest against the live column.

  # Explicit, never inherited (the Day 9 Redis lesson: an un-set timeout defaulted to 60s).
  # Provisional values: Day 14 splits these into per-lane budgets, because a batch ingestion call and
  # a single customer query have nothing in common except the endpoint they hit.
  connect-timeout: 2s
  read-timeout: 5s

  # Chunk sizing. 2000 chars is a ~500-token proxy at the ~4-chars-per-token English heuristic — an
  # approximation, stated as one, because there is no clean JVM build of Voyage's tokenizer. The
  # chunker packs to (max - overlap) and then prepends the overlap, so every chunk is under the cap
  # by construction.
  max-chunk-chars: 2000
  overlap-chars: 300

# --- Resilience4j: one dependency (Claude / the Anthropic API), two policies -------------------
# Both instances are named "anthropicApi" on purpose: the retry and the breaker are two policies on
# the SAME dependency, and the shared name keeps this file telling that story at a glance. The
# annotations live on ResolverService.resolve(...).
resilience4j:
  retry:
    instances:
      anthropicApi:
        max-attempts: 3                     # TOTAL attempts (1 original + up to 2 retries), not "3 retries"
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2   # waits ~1s, ~2s between attempts
        enable-randomized-wait: true        # jitter: spreads retries so a fleet doesn't retry in lockstep
        # ALLOWLIST, not a denylist. Only these transient Anthropic SDK exceptions are retried;
        # anything not listed (a permanent 400/401/403/404/422, or any future/unknown exception type)
        # is NOT retried. That default — "unknown ⇒ don't retry" — is the safe one: it fails closed.
        # A denylist would fail OPEN, retrying unknown errors, which is exactly how a future
        # non-idempotent operation (the Day 17 refund tool) would get silently double-fired.
        retry-exceptions:
          - com.anthropic.errors.RateLimitException     # HTTP 429 — rate limited
          - com.anthropic.errors.InternalServerException # HTTP 5xx incl. 529 overloaded
          - com.anthropic.errors.AnthropicIoException    # connection reset / socket timeout (no HTTP status)
          # Day 16, GATE 0. The odd one out: not a transport failure at all — a 200 arrived, promptly,
          # carrying something no ResolverOutput could be read out of. It is listed because retrying is
          # genuinely likely to work where retrying a 400 is not: resolve() is a pure read at
          # temperature 1.0, so the next attempt is a different draw from the same distribution rather
          # than the same request meeting the same deterministic refusal.
          #
          # Note it is deliberately ABSENT from the breaker's record-exceptions below. That asymmetry
          # is the whole design: this exception says the MODEL misbehaved, and the breaker exists to
          # track whether the DEPENDENCY is up. Recording it would let a bad prompt edit trip a breaker
          # that the classifier shares, taking down a healthy call path over a formatting problem.
          - org.aura.aura.resolver.ResolverOutputUnusableException
      # Day 12 — the Voyage embeddings API. Resilience4j is the SINGLE retry owner here too: the
      # RestClient inside VoyageEmbeddingClient has no retry of its own, for the same reason the
      # Anthropic SDK is pinned to maxRetries(0) — layered retries multiply (3 × 3 = 9 calls), they
      # do not add.
      voyage:
        max-attempts: 3                     # TOTAL attempts (1 original + up to 2 retries)
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2   # waits ~0.5s, ~1s between attempts
        enable-randomized-wait: true
        # ALLOWLIST of exactly one type. VoyageEmbeddingClient decides transient-vs-permanent at the
        # mapping site, where the HTTP status is still in hand, and encodes the verdict in the
        # exception TYPE — so this list never has to re-derive it. A VoyagePermanentException (400 /
        # 401 / 422) and any unknown exception are not listed, and therefore not retried: unknown
        # failures fail closed.
        #
        # Retry is safe on BOTH lanes because embedding is an idempotent pure read — same input, same
        # vector, nothing created or charged twice. That is a property of THIS operation, not a
        # general licence: the Day 17 refund tool performs a real money movement and must not inherit
        # this policy.
        retry-exceptions:
          - org.aura.aura.client.VoyageTransientException
  circuitbreaker:
    instances:
      anthropicApi:
        sliding-window-size: 10
        # REQUIRED with a small window: the default minimum-number-of-calls is 100, but the count-based
        # window caps recorded calls at sliding-window-size (10). 100 > 10 means the breaker could never
        # gather enough calls to evaluate its failure rate — it would stay CLOSED forever. Cap it below
        # the window so the rate is actually computed once we've seen a handful of calls.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50               # % of the window that must fail for the breaker to OPEN
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # The breaker tracks the DEPENDENCY's health, so it counts only the same transient failures the
        # retry cares about. A permanent 400 is OUR malformed request, not Claude being down — letting a
        # burst of those trip the breaker would escalate every ticket to a human over a bug on our side.
        # Same taxonomy as retry-exceptions above, by design.
        record-exceptions:
          - com.anthropic.errors.RateLimitException
          - com.anthropic.errors.InternalServerException
          - com.anthropic.errors.AnthropicIoException
